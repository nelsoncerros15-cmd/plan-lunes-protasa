<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTASA – Plan de Trabajo Semanal</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body {
  background: #b0a898;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 16px 40px;
  font-family: 'Oswald', sans-serif;
}

/* ── CONTROLES ── */
.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
  flex-wrap: wrap;
  justify-content: center;
}
.btn {
  border: none;
  border-radius: 10px;
  padding: 11px 20px;
  font-family: 'Oswald', sans-serif;
  font-size: 12px;
  letter-spacing: 1.2px;
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: opacity .15s;
}
.btn:hover { opacity: .88; }
.btn-dark { background: #1B3A28; color: #C8A84B; }
.btn-gold { background: #C8A84B; color: #1B3A28; }

/* ── TARJETA ── */
#card {
  width: 460px;
  background: #1B3A28;
  border-radius: 22px;
  overflow: hidden;
  position: relative;
}

/* Header con imagen real de fondo */
.hdr {
  padding: 16px 20px 0;
  position: relative;
}

.hdr-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 13px;
  position: relative;
  z-index: 3;
}
.hdr-name {
  font-family: 'Oswald', sans-serif;
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 4px;
  text-shadow: 0 2px 8px rgba(0,0,0,.5);
}

.hdr-building {
  height: 200px;
  border-radius: 10px 10px 0 0;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 7px;
}

/* Imagen de fondo real - se inyecta via JS */
.hdr-bg-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
}

/* Overlay degradado encima de la foto */
.hdr-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(27,58,40,0.18) 0%,
    rgba(27,58,40,0.10) 40%,
    rgba(27,58,40,0.55) 80%,
    rgba(27,58,40,0.85) 100%
  );
  z-index: 1;
}

.hdr-caption {
  color: rgba(255,255,255,.85);
  font-size: 8.5px;
  letter-spacing: 3px;
  font-family: 'Oswald', sans-serif;
  position: relative;
  z-index: 2;
  text-shadow: 0 1px 4px rgba(0,0,0,.6);
}

/* Cuerpo crema con arco */
.body-cream {
  background: #F5F0E5;
  border-radius: 28px 28px 0 0;
  margin-top: -28px;
  position: relative;
  z-index: 2;
}

/* Título */
.ttl {
  padding: 18px 20px 8px;
  text-align: center;
}
.script-row {
  font-family: 'Dancing Script', cursive;
  font-size: 28px;
  color: #2a5438;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  line-height: 1.2;
}
.main-ttl {
  font-family: 'Oswald', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: #1B3A28;
  letter-spacing: 2px;
  margin: 3px 0 13px;
}
.fecha-bar {
  background: #1B3A28;
  border-radius: 8px;
  padding: 7px 20px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.fecha-lbl {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: #C8A84B;
  letter-spacing: 2px;
}
.fecha-val {
  color: #F5F0E5;
  font-size: 14px;
  font-family: 'Oswald', sans-serif;
  letter-spacing: 1.5px;
  min-width: 90px;
  text-align: center;
  outline: none;
  border-bottom: 1px solid rgba(200,168,75,.5);
  padding: 1px 6px;
  cursor: text;
}

/* Divisor fino */
.divider {
  width: 60%;
  height: 1px;
  background: rgba(45,84,56,.15);
  margin: 0 auto 10px;
}

/* Actividades */
.acts { padding: 2px 14px 6px; }

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255,255,255,0.92);
  border: 1px solid #E2D8CA;
  border-radius: 13px;
  padding: 11px 36px 11px 12px;
  margin-bottom: 9px;
  position: relative;
  backdrop-filter: blur(2px);
}
.ico {
  width: 52px;
  height: 52px;
  min-width: 52px;
  background: #1B3A28;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity .15s;
}
.ico:hover { opacity: .85; }
.act-body { flex: 1; min-width: 0; }

.act-ttl {
  font-family: 'Oswald', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: #1B3A28;
  letter-spacing: .5px;
  outline: none;
  cursor: text;
  min-height: 20px;
  display: block;
}
.act-dtl {
  font-family: 'Oswald', sans-serif;
  font-size: 12px;
  color: #7d8f7b;
  outline: none;
  cursor: text;
  min-height: 17px;
  display: block;
  margin-top: 2px;
}
[contenteditable]:focus { background: rgba(200,168,75,.07); border-radius: 3px; padding: 0 3px; }
[contenteditable]:empty::before { content: attr(placeholder); color: #bbb; font-style: italic; }

.delbtn {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: #d0c8c0;
  cursor: pointer;
  font-size: 17px;
  padding: 4px;
  border-radius: 4px;
  display: none;
  line-height: 1;
  font-family: monospace;
}
.row:hover .delbtn { display: block; }
.delbtn:hover { color: #d94040; }

/* Agregar */
.add-wrap { padding: 0 14px 14px; }
.addbtn {
  width: 100%;
  background: none;
  border: 2px dashed #2a5438;
  border-radius: 11px;
  color: #2a5438;
  font-size: 11.5px;
  padding: 9px;
  cursor: pointer;
  font-family: 'Oswald', sans-serif;
  letter-spacing: 1.5px;
  font-weight: 600;
}
.addbtn:hover { background: rgba(42,84,56,.05); }

/* Footer */
.ftr {
  background: #1B3A28;
  padding: 15px 20px 16px;
}
.ftr-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}
.p-logo {
  width: 38px;
  height: 38px;
  min-width: 38px;
  border: 1.5px solid #C8A84B;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #C8A84B;
  font-size: 18px;
  font-weight: 700;
  font-family: 'Oswald', sans-serif;
}
.p-brand { line-height: 1.3; }
.p-name { color: #C8A84B; font-size: 11px; letter-spacing: 2.5px; font-family: 'Oswald', sans-serif; }
.p-sub  { color: rgba(200,168,75,.4); font-size: 8px; letter-spacing: 2px; font-family: 'Oswald', sans-serif; }

.tagline {
  text-align: center;
  color: rgba(200,168,75,.72);
  font-size: 8px;
  letter-spacing: .8px;
  line-height: 1.8;
  margin-bottom: 11px;
  font-family: 'Oswald', sans-serif;
}
.vals {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 4px;
  text-align: center;
  border-top: 1px solid rgba(200,168,75,.12);
  padding-top: 10px;
}
.vn { color: #7ab08a; font-size: 7.5px; letter-spacing: .6px; display: block; font-family: 'Oswald', sans-serif; }
.vs { color: #4a7a5a; font-size: 6.5px; display: block; margin-top: 2px; font-family: 'Oswald', sans-serif; }

/* ── Ícono helper "tooltip" ── */
.ico-tip {
  font-size: 9px;
  color: #999;
  text-align: center;
  margin-bottom: 6px;
  font-family: 'Oswald', sans-serif;
  letter-spacing: .5px;
}
</style>
</head>
<body>

<!-- Controles fuera de la tarjeta -->
<div class="controls" id="controls">
  <button class="btn btn-dark" onclick="addRow()">&#43; AGREGAR ÁREA</button>
  <button class="btn btn-gold" onclick="descargar()">&#11015; DESCARGAR IMAGEN</button>
  <button class="btn btn-dark" onclick="copiarTexto()">&#128203; COPIAR PARA WHATSAPP</button>
</div>

<!-- ═══════════ TARJETA ═══════════ -->
<div id="card">

  <!-- HEADER VERDE con foto real -->
  <div class="hdr">
    <div class="hdr-logo">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <ellipse cx="15" cy="15" rx="6.5" ry="12" transform="rotate(-20 15 15)" fill="white" opacity=".9"/>
        <line x1="15" y1="25" x2="15" y2="6" stroke="#1B3A28" stroke-width="1.5"/>
        <line x1="15" y1="16" x2="18.5" y2="12.5" stroke="#1B3A28" stroke-width="1.1"/>
        <line x1="15" y1="19.5" x2="11.5" y2="16" stroke="#1B3A28" stroke-width="1.1"/>
        <line x1="15" y1="12.5" x2="17.5" y2="10" stroke="#1B3A28" stroke-width=".9"/>
      </svg>
      <span class="hdr-name">PROTASA</span>
    </div>

    <!-- Área del edificio — imagen real de fondo -->
    <div class="hdr-building">
      <img class="hdr-bg-img" id="bgImg" src="" alt="PROTASA Building" crossorigin="anonymous">
      <div class="hdr-overlay"></div>
      <span class="hdr-caption">PREINDUSTRIA · OCOTAL, N.S. · NICARAGUA</span>
    </div>
  </div><!-- /hdr -->

  <!-- CUERPO CREMA con arco -->
  <div class="body-cream">

    <!-- Título -->
    <div class="ttl">
      <div class="script-row">
        <svg width="17" height="17" viewBox="0 0 17 17"><ellipse cx="8.5" cy="8.5" rx="4" ry="7" transform="rotate(-20 8.5 8.5)" fill="#2a5438" opacity=".75"/></svg>
        Plan de Trabajo
        <svg width="17" height="17" viewBox="0 0 17 17"><ellipse cx="8.5" cy="8.5" rx="4" ry="7" transform="rotate(20 8.5 8.5)" fill="#2a5438" opacity=".75"/></svg>
      </div>
      <div class="main-ttl">ACTIVIDADES PARA EL LUNES</div>
      <div class="fecha-bar">
        <span class="fecha-lbl">FECHA:</span>
        <span class="fecha-val"
              id="fecha"
              contenteditable="true"
              spellcheck="false"
              placeholder="DD-MM-AA">12-01-26</span>
      </div>
      <div class="divider"></div>
    </div>

    <!-- Actividades -->
    <div class="acts" id="acts"></div>

    <!-- Botón agregar -->
    <div class="add-wrap" id="add-wrap">
      <button class="addbtn" onclick="addRow()">&#43; AGREGAR ÁREA</button>
    </div>

  </div><!-- /body-cream -->

  <!-- FOOTER -->
  <div class="ftr">
    <div class="ftr-top">
      <div class="p-logo">P</div>
      <div class="p-brand">
        <div class="p-name">PLASENCIA</div>
        <div class="p-sub">GROUP</div>
      </div>
    </div>
    <div class="tagline">
      CALIDAD QUE SE SIENTE, PROCESOS QUE RESPALDAN,<br>EXCELENCIA QUE TRASCIENDE.
    </div>
    <div class="vals">
      <div><span class="vn">CALIDAD</span><span class="vs">QUE SE SIENTE</span></div>
      <div><span class="vn">PROCESOS</span><span class="vs">QUE RESPALDAN</span></div>
      <div><span class="vn">EXCELENCIA</span><span class="vs">QUE TRASCIENDE</span></div>
      <div><span class="vn">TRADICIÓN</span><span class="vs">QUE NOS UNE</span></div>
    </div>
  </div>

</div><!-- /card -->

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  var c = document.getElementById('acts');
  c.innerHTML = '';
  rows.forEach(function(r, i) {
    var d = document.createElement('div');
    d.className = 'row';
    d.innerHTML =
      '<div class="ico" onclick="cycleIcon(' + i + ')" title="Clic para cambiar ícono">'
        + ICONS[r.icon] +
      '</div>' +
      '<div class="act-body">' +
        '<div class="act-ttl" contenteditable="true" spellcheck="false" placeholder="Nombre de la actividad">' + esc(r.title) + '</div>' +
        '<div class="act-dtl" contenteditable="true" spellcheck="false" placeholder="(detalle, cosecha, origen...)">' + esc(r.detail) + '</div>' +
      '</div>' +
      '<button class="delbtn" onclick="delRow(' + i + ')" title="Eliminar fila">&#10005;</button>';

    d.querySelector('.act-ttl').addEventListener('input', (function(idx) {
      return function() { rows[idx].title = this.textContent.trim(); };
    })(i));
    d.querySelector('.act-dtl').addEventListener('input', (function(idx) {
      return function() { rows[idx].detail = this.textContent.trim(); };
    })(i));

    c.appendChild(d);
  });
}

function cycleIcon(i) {
  var idx = CYCLE.indexOf(rows[i].icon);
  rows[i].icon = CYCLE[(idx + 1) % CYCLE.length];
  render();
}

function addRow() {
  rows.push({ icon: 'leaf', title: 'NUEVA ÁREA', detail: '' });
  render();
  setTimeout(function() {
    var ttls = document.querySelectorAll('.act-ttl');
    if (ttls.length) {
      var last = ttls[ttls.length - 1];
      last.focus();
      var range = document.createRange();
      range.selectNodeContents(last);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }, 80);
}

function delRow(i) {
  if (rows.length <= 1) { alert('Debe haber al menos una actividad.'); return; }
  rows.splice(i, 1);
  render();
}

function descargar() {
  var addWrap  = document.getElementById('add-wrap');
  var controls = document.getElementById('controls');
  var tip      = document.querySelector('.ico-tip');

  /* ── 1. Capturar TODOS los textos editables ANTES de tocar el DOM ── */
  var fechaTxt = document.getElementById('fecha').textContent.trim() || '–';

  var ttlEls = document.querySelectorAll('.act-ttl');
  var dtlEls = document.querySelectorAll('.act-dtl');
  var ttlTxts = [], dtlTxts = [];
  ttlEls.forEach(function(el){ ttlTxts.push(el.innerText.trim()); });
  dtlEls.forEach(function(el){ dtlTxts.push(el.innerText.trim()); });

  /* ── 2. Convertir contenteditable → span estático (html2canvas los lee bien) ── */
  var fechaEl = document.getElementById('fecha');
  fechaEl.setAttribute('data-prev-ce', 'true');
  fechaEl.removeAttribute('contenteditable');
  fechaEl.textContent = fechaTxt;

  ttlEls.forEach(function(el, i){
    el.removeAttribute('contenteditable');
    el.textContent = ttlTxts[i];
  });
  dtlEls.forEach(function(el, i){
    el.removeAttribute('contenteditable');
    el.textContent = dtlTxts[i];
  });

  /* ── 3. Ocultar UI de edición ── */
  addWrap.style.display     = 'none';
  controls.style.visibility = 'hidden';
  if (tip) tip.style.display = 'none';
  document.querySelectorAll('.delbtn').forEach(function(b){ b.style.display='none'; });

  /* Ocultar script-row (ya aparece en la foto) */
  var scriptRow = document.querySelector('.script-row');
  if (scriptRow) scriptRow.style.visibility = 'hidden';

  var card = document.getElementById('card');
  var SCALE = 4;

  document.fonts.ready.then(function() {
    setTimeout(function() {

      html2canvas(card, {
        scale: SCALE,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#1B3A28',
        logging: false,
        imageTimeout: 0
      }).then(function(canvas) {

        /* ── 4. Canvas final ── */
        var finalCanvas = document.createElement('canvas');
        finalCanvas.width  = canvas.width;
        finalCanvas.height = canvas.height;
        var ctx = finalCanvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        /* Base html2canvas */
        ctx.drawImage(canvas, 0, 0);

        /* ── 5. Re-pintar foto del header nítida ── */
        var bgImg       = document.getElementById('bgImg');
        var hdrBuilding = document.querySelector('.hdr-building');
        var cardRect    = card.getBoundingClientRect();
        var hdrRect     = hdrBuilding.getBoundingClientRect();

        var hx = Math.round((hdrRect.left - cardRect.left) * SCALE);
        var hy = Math.round((hdrRect.top  - cardRect.top)  * SCALE);
        var hw = Math.round(hdrRect.width  * SCALE);
        var hh = Math.round(hdrRect.height * SCALE);

        var iw = bgImg.naturalWidth, ih = bgImg.naturalHeight;
        var sc = Math.max(hw / iw, hh / ih);
        var sw = hw / sc, sh = hh / sc;
        var sx = (iw - sw) / 2, sy = 0;

        ctx.save();
        var r = 10 * SCALE;
        ctx.beginPath();
        ctx.moveTo(hx+r, hy); ctx.lineTo(hx+hw-r, hy);
        ctx.quadraticCurveTo(hx+hw, hy, hx+hw, hy+r);
        ctx.lineTo(hx+hw, hy+hh); ctx.lineTo(hx, hy+hh);
        ctx.lineTo(hx, hy+r); ctx.quadraticCurveTo(hx, hy, hx+r, hy);
        ctx.closePath(); ctx.clip();
        ctx.drawImage(bgImg, sx, sy, sw, sh, hx, hy, hw, hh);
        var grad = ctx.createLinearGradient(hx, hy, hx, hy+hh);
        grad.addColorStop(0,   'rgba(27,58,40,0.18)');
        grad.addColorStop(0.4, 'rgba(27,58,40,0.10)');
        grad.addColorStop(0.8, 'rgba(27,58,40,0.55)');
        grad.addColorStop(1.0, 'rgba(27,58,40,0.85)');
        ctx.fillStyle = grad; ctx.fillRect(hx, hy, hw, hh);
        ctx.restore();

        /* ── 6. Dibujar la FECHA directamente en canvas ── */
        var fechaBarEl = document.querySelector('.fecha-bar');
        var fechaBarRect = fechaBarEl.getBoundingClientRect();

        var fbx = Math.round((fechaBarRect.left - cardRect.left) * SCALE);
        var fby = Math.round((fechaBarRect.top  - cardRect.top)  * SCALE);
        var fbw = Math.round(fechaBarRect.width  * SCALE);
        var fbh = Math.round(fechaBarRect.height * SCALE);

        /* Redibujar la barra de fecha completa */
        ctx.save();
        var br = 8 * SCALE;
        ctx.beginPath();
        ctx.moveTo(fbx+br, fby); ctx.lineTo(fbx+fbw-br, fby);
        ctx.quadraticCurveTo(fbx+fbw, fby, fbx+fbw, fby+br);
        ctx.lineTo(fbx+fbw, fby+fbh); ctx.quadraticCurveTo(fbx+fbw, fby+fbh, fbx+fbw-br, fby+fbh);
        ctx.lineTo(fbx+br, fby+fbh); ctx.quadraticCurveTo(fbx, fby+fbh, fbx, fby+fbh-br);
        ctx.lineTo(fbx, fby+br); ctx.quadraticCurveTo(fbx, fby, fbx+br, fby);
        ctx.closePath();
        ctx.fillStyle = '#1B3A28';
        ctx.fill();

        /* Texto FECHA: */
        var pad = 20 * SCALE;
        ctx.font = 'bold ' + (11 * SCALE) + 'px Oswald, sans-serif';
        ctx.fillStyle = '#C8A84B';
        ctx.letterSpacing = (2 * SCALE) + 'px';
        ctx.textBaseline = 'middle';
        ctx.fillText('FECHA:', fbx + pad, fby + fbh / 2);

        /* Medir ancho de "FECHA:" para posicionar el valor */
        var lblWidth = ctx.measureText('FECHA:').width + (12 * SCALE);

        /* Texto del valor de la fecha */
        ctx.font = (14 * SCALE) + 'px Oswald, sans-serif';
        ctx.fillStyle = '#F5F0E5';
        ctx.letterSpacing = (1.5 * SCALE) + 'px';
        ctx.fillText(fechaTxt, fbx + pad + lblWidth, fby + fbh / 2);
        ctx.restore();

        /* ── 7. Descargar ── */
        var nombreFecha = fechaTxt.replace(/[/\\:*?"<>|]/g, '_');
        var a = document.createElement('a');
        a.download = 'PROTASA-Plan-Lunes-' + nombreFecha + '.png';
        a.href = finalCanvas.toDataURL('image/png', 1.0);
        a.click();

        /* ── 8. Restaurar DOM ── */
        fechaEl.setAttribute('contenteditable', 'true');
        fechaEl.textContent = fechaTxt;

        ttlEls.forEach(function(el, i){
          el.setAttribute('contenteditable', 'true');
          el.textContent = ttlTxts[i];
        });
        dtlEls.forEach(function(el, i){
          el.setAttribute('contenteditable', 'true');
          el.textContent = dtlTxts[i];
        });

        addWrap.style.display     = '';
        controls.style.visibility = '';
        if (tip) tip.style.display = '';
        if (scriptRow) scriptRow.style.visibility = '';
        document.querySelectorAll('.delbtn').forEach(function(b){ b.style.display=''; });

      }).catch(function(err) {
        alert('Error: ' + err.message);
        /* Restaurar en caso de error */
        fechaEl.setAttribute('contenteditable', 'true');
        ttlEls.forEach(function(el){ el.setAttribute('contenteditable','true'); });
        dtlEls.forEach(function(el){ el.setAttribute('contenteditable','true'); });
        addWrap.style.display = '';
        controls.style.visibility = '';
        if (tip) tip.style.display = '';
        if (scriptRow) scriptRow.style.visibility = '';
      });

    }, 80);
  });
}
function copiarTexto() {
  var fecha = (document.getElementById('fecha').textContent || '').trim();
  var msg = 'Buenas Tardes, lo que tendremos en los Despalillos y Abertura para este Lunes ' + fecha + ' ⬇️';

  rows.forEach(function(r) {
    var titulo = r.title.trim();
    if (/notas/i.test(titulo) || /otras actividades/i.test(titulo)) return;
    msg += '\n\n' + titulo;
    if (r.detail.trim()) msg += '\n' + r.detail.trim();
  });

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(msg).then(function() {
      mostrarToast('✅ ¡Mensaje copiado para WhatsApp!');
    }).catch(function() {
      fallbackCopy(msg);
    });
  } else {
    fallbackCopy(msg);
  }
}

function fallbackCopy(msg) {
  var ta = document.createElement('textarea');
  ta.value = msg;
  ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); mostrarToast('✅ ¡Copiado!'); }
  catch(e) { prompt('Copia este mensaje:', msg); }
  document.body.removeChild(ta);
}

function mostrarToast(msg) {
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B3A28;color:#C8A84B;padding:10px 20px;border-radius:10px;font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.8px;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.25);';
  document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .5s'; }, 2200);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2800);
}

var tip = document.createElement('p');
tip.className = 'ico-tip';
tip.textContent = 'Tip: Clic en el ícono verde para cambiarlo · Clic en el texto para editar';
document.getElementById('acts').parentNode.insertBefore(tip, document.getElementById('acts'));

render();
</script>
