<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTASA – Plan de Trabajo Semanal</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body {
  background: #c5bfb2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 16px 40px;
  font-family: 'Oswald', sans-serif;
}

/* ── CONTROLES ── */
.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
  flex-wrap: wrap;
  justify-content: center;
}
.btn {
  border: none;
  border-radius: 10px;
  padding: 11px 20px;
  font-family: 'Oswald', sans-serif;
  font-size: 12px;
  letter-spacing: 1.2px;
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: opacity .15s;
}
.btn:hover { opacity: .88; }
.btn-dark { background: #1B3A28; color: #C8A84B; }
.btn-gold { background: #C8A84B; color: #1B3A28; }

/* ── TARJETA ── */
#card {
  width: 460px;
  background: #1B3A28;
  border-radius: 22px;
  overflow: hidden;
}

/* Header */
.hdr { padding: 16px 20px 0; }

.hdr-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 13px;
}
.hdr-name {
  font-family: 'Oswald', sans-serif;
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 4px;
}

.hdr-building {
  height: 112px;
  border-radius: 10px 10px 0 0;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 7px;
  background: #243d2d;
}
.hdr-caption {
  color: rgba(255,255,255,.2);
  font-size: 8px;
  letter-spacing: 3px;
  font-family: 'Oswald', sans-serif;
  position: relative;
  z-index: 2;
}

/* Cuerpo crema con arco */
.body-cream {
  background: #F5F0E5;
  border-radius: 28px 28px 0 0;
  margin-top: -22px;
  position: relative;
  z-index: 2;
}

/* Título */
.ttl {
  padding: 18px 20px 8px;
  text-align: center;
}
.script-row {
  font-family: 'Dancing Script', cursive;
  font-size: 28px;
  color: #2a5438;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  line-height: 1.2;
}
.main-ttl {
  font-family: 'Oswald', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: #1B3A28;
  letter-spacing: 2px;
  margin: 3px 0 13px;
}
.fecha-bar {
  background: #1B3A28;
  border-radius: 8px;
  padding: 7px 20px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.fecha-lbl {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: #C8A84B;
  letter-spacing: 2px;
}
.fecha-val {
  color: #F5F0E5;
  font-size: 14px;
  font-family: 'Oswald', sans-serif;
  letter-spacing: 1.5px;
  min-width: 90px;
  text-align: center;
  outline: none;
  border-bottom: 1px solid rgba(200,168,75,.5);
  padding: 1px 6px;
  cursor: text;
}

/* Divisor fino */
.divider {
  width: 60%;
  height: 1px;
  background: rgba(45,84,56,.15);
  margin: 0 auto 10px;
}

/* Actividades */
.acts { padding: 2px 14px 6px; }

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #fff;
  border: 1px solid #E2D8CA;
  border-radius: 13px;
  padding: 11px 36px 11px 12px;
  margin-bottom: 9px;
  position: relative;
}
.ico {
  width: 52px;
  height: 52px;
  min-width: 52px;
  background: #1B3A28;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity .15s;
}
.ico:hover { opacity: .85; }
.act-body { flex: 1; min-width: 0; }

.act-ttl {
  font-family: 'Oswald', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: #1B3A28;
  letter-spacing: .5px;
  outline: none;
  cursor: text;
  min-height: 20px;
  display: block;
}
.act-dtl {
  font-family: 'Oswald', sans-serif;
  font-size: 14px;
  color: #5a7058;
  outline: none;
  cursor: text;
  min-height: 17px;
  display: block;
  margin-top: 2px;
}
[contenteditable]:focus { background: rgba(200,168,75,.07); border-radius: 3px; padding: 0 3px; }
[contenteditable]:empty::before { content: attr(placeholder); color: #bbb; font-style: italic; }

.delbtn {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: #d0c8c0;
  cursor: pointer;
  font-size: 17px;
  padding: 4px;
  border-radius: 4px;
  display: none;
  line-height: 1;
  font-family: monospace;
}
.row:hover .delbtn { display: block; }
.delbtn:hover { color: #d94040; }

/* Agregar */
.add-wrap { padding: 0 14px 14px; }
.addbtn {
  width: 100%;
  background: none;
  border: 2px dashed #2a5438;
  border-radius: 11px;
  color: #2a5438;
  font-size: 11.5px;
  padding: 9px;
  cursor: pointer;
  font-family: 'Oswald', sans-serif;
  letter-spacing: 1.5px;
  font-weight: 600;
}
.addbtn:hover { background: rgba(42,84,56,.05); }

/* Footer */
.ftr {
  background: #1B3A28;
  padding: 15px 20px 16px;
}
.ftr-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}
.p-logo {
  width: 38px;
  height: 38px;
  min-width: 38px;
  border: 1.5px solid #C8A84B;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #C8A84B;
  font-size: 18px;
  font-weight: 700;
  font-family: 'Oswald', sans-serif;
}
.p-brand { line-height: 1.3; }
.p-name { color: #C8A84B; font-size: 11px; letter-spacing: 2.5px; font-family: 'Oswald', sans-serif; }
.p-sub  { color: rgba(200,168,75,.4); font-size: 8px; letter-spacing: 2px; font-family: 'Oswald', sans-serif; }

.tagline {
  text-align: center;
  color: rgba(200,168,75,.72);
  font-size: 8px;
  letter-spacing: .8px;
  line-height: 1.8;
  margin-bottom: 11px;
  font-family: 'Oswald', sans-serif;
}
.vals {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 4px;
  text-align: center;
  border-top: 1px solid rgba(200,168,75,.12);
  padding-top: 10px;
}
.vn { color: #7ab08a; font-size: 7.5px; letter-spacing: .6px; display: block; font-family: 'Oswald', sans-serif; }
.vs { color: #4a7a5a; font-size: 6.5px; display: block; margin-top: 2px; font-family: 'Oswald', sans-serif; }

/* ── Ícono helper "tooltip" ── */
.ico-tip {
  font-size: 9px;
  color: #999;
  text-align: center;
  margin-bottom: 6px;
  font-family: 'Oswald', sans-serif;
  letter-spacing: .5px;
}
</style>
</head>
<body>

<!-- ═══════════ JAVASCRIPT ═══════════ -->
<script>
/* ── Íconos inline SVG ── */
var ICONS = {
  leaf: '<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><ellipse cx="13" cy="13" rx="6" ry="11" transform="rotate(-20 13 13)" fill="white" opacity=".88"/><line x1="13" y1="22" x2="13" y2="5" stroke="#1B3A28" stroke-width="1.4"/><line x1="13" y1="15" x2="16.5" y2="11.5" stroke="#1B3A28" stroke-width="1.1"/><line x1="13" y1="18.5" x2="9.5" y2="15" stroke="#1B3A28" stroke-width="1.1"/><line x1="13" y1="11.5" x2="15.5" y2="9" stroke="#1B3A28" stroke-width=".9"/></svg>',
  plant: '<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><line x1="13" y1="24" x2="13" y2="13" stroke="white" stroke-width="1.6"/><circle cx="13" cy="10" r="5.5" stroke="white" stroke-width="1.3" fill="none"/><line x1="13" y1="10" x2="9.5" y2="6.5" stroke="white" stroke-width="1.1"/><line x1="13" y1="10" x2="16.5" y2="6.5" stroke="white" stroke-width="1.1"/><line x1="13" y1="14" x2="8.5" y2="11" stroke="white" stroke-width="1.1"/><line x1="13" y1="14" x2="17.5" y2="11" stroke="white" stroke-width="1.1"/></svg>',
  warehouse: '<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><rect x="3" y="10" width="20" height="14" rx="1" stroke="white" stroke-width="1.3"/><polyline points="2,10 13,2 24,10" stroke="white" stroke-width="1.3" fill="none"/><rect x="10" y="16" width="6" height="8" stroke="white" stroke-width="1.1"/><rect x="4.5" y="13" width="4" height="4" rx=".6" stroke="white" stroke-width="1"/><rect x="17.5" y="13" width="4" height="4" rx=".6" stroke="white" stroke-width="1"/></svg>',
  note: '<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><rect x="4" y="3" width="18" height="20" rx="2" stroke="white" stroke-width="1.3"/><line x1="8" y1="9" x2="18" y2="9" stroke="white" stroke-width="1.1"/><line x1="8" y1="13" x2="18" y2="13" stroke="white" stroke-width="1.1"/><line x1="8" y1="17" x2="14" y2="17" stroke="white" stroke-width="1.1"/></svg>'
};
var CYCLE = ['leaf', 'plant', 'warehouse', 'note'];

/* ── Datos iniciales ── */
var rows = [
  { icon: 'leaf',      title: 'DESPALILLO #1',           detail: '(Jalapa FINO · Mayo-25)' },
  { icon: 'plant',     title: 'DESPALILLO #3 – ABERTURA', detail: '(Esteli F. · Julio-25)'  },
  { icon: 'plant',     title: 'DESPALILLO #4 – ABERTURA', detail: '(Esteli F. · Julio-25)'  },
  { icon: 'warehouse', title: 'OTRAS ACTIVIDADES / NOTAS', detail: ''                        }
];

/* ── Escape HTML ── */
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── Renderizar filas ── */
function render() {
  var c = document.getElementById('acts');
  c.innerHTML = '';
  rows.forEach(function(r, i) {
    var d = document.createElement('div');
    d.className = 'row';
    d.innerHTML =
      '<div class="ico" onclick="cycleIcon(' + i + ')" title="Clic para cambiar ícono">'
        + ICONS[r.icon] +
      '</div>' +
      '<div class="act-body">' +
        '<div class="act-ttl" contenteditable="true" spellcheck="false" placeholder="Nombre de la actividad">' + esc(r.title) + '</div>' +
        '<div class="act-dtl" contenteditable="true" spellcheck="false" placeholder="(detalle, cosecha, origen...)">' + esc(r.detail) + '</div>' +
      '</div>' +
      '<button class="delbtn" onclick="delRow(' + i + ')" title="Eliminar fila">&#10005;</button>';

    /* Guardar cambios en tiempo real */
    d.querySelector('.act-ttl').addEventListener('input', (function(idx) {
      return function() { rows[idx].title = this.textContent.trim(); };
    })(i));
    d.querySelector('.act-dtl').addEventListener('input', (function(idx) {
      return function() { rows[idx].detail = this.textContent.trim(); };
    })(i));

    c.appendChild(d);
  });
}

/* ── Ciclar ícono al hacer clic ── */
function cycleIcon(i) {
  var idx = CYCLE.indexOf(rows[i].icon);
  rows[i].icon = CYCLE[(idx + 1) % CYCLE.length];
  render();
}

/* ── Agregar fila ── */
function addRow() {
  rows.push({ icon: 'leaf', title: 'NUEVA ÁREA', detail: '' });
  render();
  setTimeout(function() {
    var ttls = document.querySelectorAll('.act-ttl');
    if (ttls.length) {
      var last = ttls[ttls.length - 1];
      last.focus();
      var range = document.createRange();
      range.selectNodeContents(last);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }, 80);
}

/* ── Eliminar fila ── */
function delRow(i) {
  if (rows.length <= 1) { alert('Debe haber al menos una actividad.'); return; }
  rows.splice(i, 1);
  render();
}

/* ── Descargar imagen ── */
function descargar() {
  var addWrap  = document.getElementById('add-wrap');
  var controls = document.getElementById('controls');
  var tip      = document.querySelector('.ico-tip');

  addWrap.style.display  = 'none';
  controls.style.opacity = '.4';
  controls.style.pointerEvents = 'none';
  if (tip) tip.style.display = 'none';
  document.querySelectorAll('.delbtn').forEach(function(b){ b.style.display = 'none'; });

  document.fonts.ready.then(function() {
    html2canvas(document.getElementById('card'), {
      scale: 3,
      useCORS: true,
      allowTaint: false,
      backgroundColor: '#1B3A28',
      logging: false
    }).then(function(canvas) {
      var fecha = (document.getElementById('fecha').textContent || 'semana').trim().replace(/[\/\\:*?"<>|]/g,'_');
      var a = document.createElement('a');
      a.download = 'PROTASA-Plan-Lunes-' + fecha + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();

      /* Restaurar */
      addWrap.style.display  = '';
      controls.style.opacity = '1';
      controls.style.pointerEvents = '';
      if (tip) tip.style.display = '';
      document.querySelectorAll('.delbtn').forEach(function(b){ b.style.display = ''; });
    }).catch(function(err) {
      alert('Error al generar imagen: ' + err.message);
      addWrap.style.display  = '';
      controls.style.opacity = '1';
      controls.style.pointerEvents = '';
    });
  });
}

/* ── Copiar texto para WhatsApp ── */
function copiarTexto() {
  var fecha = (document.getElementById('fecha').textContent || '').trim();
  var msg = 'Buenas Tardes, lo que tendremos en los Despalillos y Abertura para este Lunes ' + fecha + ' ⬇️';

  rows.forEach(function(r) {
    var titulo = r.title.trim();
    if (/notas/i.test(titulo) || /otras actividades/i.test(titulo)) return;
    msg += '\n\n' + titulo;
    if (r.detail.trim()) msg += '\n' + r.detail.trim();
  });

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(msg).then(function() {
      mostrarToast('✅ ¡Mensaje copiado para WhatsApp!');
    }).catch(function() {
      fallbackCopy(msg);
    });
  } else {
    fallbackCopy(msg);
  }
}

function fallbackCopy(msg) {
  var ta = document.createElement('textarea');
  ta.value = msg;
  ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); mostrarToast('✅ ¡Copiado!'); }
  catch(e) { prompt('Copia este mensaje:', msg); }
  document.body.removeChild(ta);
}

/* ── Toast de confirmación ── */
function mostrarToast(msg) {
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B3A28;color:#C8A84B;padding:10px 20px;border-radius:10px;font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.8px;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.25);';
  document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .5s'; }, 2200);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2800);
}

/* ── Ayuda íconos ── */
var tip = document.createElement('p');
tip.className = 'ico-tip';
tip.textContent = 'Tip: Clic en el ícono verde para cambiarlo · Clic en el texto para editar';
document.getElementById('acts').parentNode.insertBefore(tip, document.getElementById('acts'));

/* ── Init ── */
render();
</script>
</body>
</html>
